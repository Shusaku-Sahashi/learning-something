# Ch9 の題材。このファイルはサンプルであり、
# このリポジトリの CI としては動いていません (パスが project/ 配下のため)。
# 自分のプロジェクトにコピーして使ってください。
name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎日 18:00 UTC に nightly プロファイルで回す
    - cron: '0 18 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.4.8', '9.6.4']
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.10'

      # 依存関係のキャッシュ。テストの待ち時間がここで決まります。
      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
          restore-keys: ${{ runner.os }}-ghc${{ matrix.ghc }}-

      - run: cabal update
      - run: cabal build --enable-tests

      # PR ごとのテストは ci プロファイル (maxSuccess = 1000)
      - name: Run property tests
        if: github.event_name != 'schedule'
        env:
          QC_PROFILE: ci
        run: cabal test --test-show-details=direct

      # 夜間は nightly プロファイル (maxSuccess = 50000)
      - name: Run nightly property tests
        if: github.event_name == 'schedule'
        env:
          QC_PROFILE: nightly
        run: cabal test --test-show-details=direct
